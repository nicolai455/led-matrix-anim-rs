[package]
name = "matrix-preview"
version = "0.1.0"
edition = "2021"
description = "WebAssembly browser preview renderer for LED matrix animations"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
matrix-core = { path = "../matrix-core" }
matrix-effects = { path = "../matrix-effects" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
