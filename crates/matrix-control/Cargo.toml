[package]
name = "matrix-control"
version = "0.1.0"
edition = "2021"
description = "Bounded render actor ControlHub, Home Assistant discovery, embedded web UI, and simulator adapters"

[features]
default = ["host"]
host = ["dep:tiny_http", "dep:rumqttc", "dep:clap", "dep:matrix-effects", "dep:ctrlc"]

[dependencies]
matrix-core = { path = "../matrix-core" }
matrix-effects = { path = "../matrix-effects", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
tiny_http = { version = "0.12", optional = true }
rumqttc = { version = "0.25", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
ctrlc = { version = "3.5", optional = true }

[[bin]]
name = "matrix-simulator"
path = "src/bin/simulator.rs"
required-features = ["host"]
