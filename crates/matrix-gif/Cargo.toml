[package]
name = "matrix-gif"
version = "0.1.0"
edition = "2021"
description = "Renders every built-in LED matrix effect to animated GIFs and contact-sheet PNGs"

[[bin]]
name = "matrix-gif"
path = "src/main.rs"

[dependencies]
image = { version = "0.25", default-features = false, features = ["gif", "png"] }
clap = { version = "4", features = ["derive"] }
matrix-core = { path = "../matrix-core" }
matrix-effects = { path = "../matrix-effects" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
